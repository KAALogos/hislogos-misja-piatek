const el=document.getElementById('app');
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(n,d)=>d?Math.round(n/d*100):0;
const solved=(q)=>!!answers[q.id];
const passed=(q)=>!!answers[q.id]?.correct;
const problems=()=>ALL.filter(q=>answers[q.id]&&(!answers[q.id].correct||answers[q.id].uncertain));
const attempted=()=>ALL.filter(solved).length;
const successes=()=>ALL.filter(passed).length;
function store(){try{localStorage.setItem(STORE,JSON.stringify(answers))}catch(e){}}
function groupCount(g){let qs=g==='maps'?MAPS.flatMap(b=>b.qs):g==='chrono'?CHRON:SRC;return {done:qs.filter(solved).length,all:qs.length,right:qs.filter(passed).length}}
function navigate(view, block){ui.view=view;ui.wantReset=false;if(block)ui.block=block;if(view==='maps'){let cur=MAPS.find(b=>b.id===ui.block)||MAPS[0];ui.qidx=Math.max(0,cur.qs.findIndex(q=>!solved(q)))}else if(view==='chrono'||view==='detective'){let qs=view==='chrono'?CHRON:SRC;ui.qidx=Math.max(0,qs.findIndex(q=>!solved(q)))}else if(view==='review'){ui.reviewIndex=0;}redraw(false)}
function chooseBlock(id){ui.block=id;ui.qidx=Math.max(0,MAPS.find(b=>b.id===id).qs.findIndex(q=>!solved(q)));redraw(false)}
function navQuestion(i){ui.qidx=i;redraw(false)}
function reviewAt(i){ui.reviewIndex=i;redraw(false)}
function getCurrent(){if(ui.view==='maps')return MAPS.find(b=>b.id===ui.block).qs[ui.qidx];if(ui.view==='chrono')return CHRON[ui.qidx];if(ui.view==='detective')return SRC[ui.qidx];if(ui.view==='review')return problems()[ui.reviewIndex];return null}
function currentSeq(){if(ui.view==='maps')return MAPS.find(b=>b.id===ui.block).qs;if(ui.view==='chrono')return CHRON;if(ui.view==='detective')return SRC;if(ui.view==='review')return problems();return []}
function hash(s){let x=16114;for(const c of s)x=((x*31+c.charCodeAt(0))>>>0);return x}
function initialDraft(q){if(q.type==='order'){
 let seed=hash(q.id);let arr=q.events.map(x=>x[1]);for(let j=arr.length-1;j>0;j--){seed=(seed*1664525+1013904223)>>>0;let k=seed%(j+1);[arr[j],arr[k]]=[arr[k],arr[j]]}if(arr.every((x,i)=>x===q.events[i][1]))arr.reverse();return arr;
 }if(q.type==='match')return q.pairs.map(_=>'');if(q.type==='multi')return [];return null}
function draft(q){if(!(q.id in ui.draft))ui.draft[q.id]=answers[q.id]?.value??initialDraft(q);return ui.draft[q.id]}
function hasValue(q,v){if(v===null||v===undefined)return false;if(q.type==='multi')return v.length>0;if(q.type==='match')return v.length===q.pairs.length&&v.every(Boolean);if(q.type==='order')return v.length===q.events.length;return v!==''}
function equals(q,v){if(q.type==='multi')return JSON.stringify([...v].sort())===JSON.stringify([...q.a].sort());if(q.type==='match')return q.pairs.every((p,i)=>v[i]===p[1]);if(q.type==='order')return JSON.stringify(v)===JSON.stringify(q.events.map(e=>e[1]));return v===q.a}
function setChoice(v){const q=getCurrent();if(!q||answers[q.id])return;ui.draft[q.id]=v;redraw(true)}
function toggleMulti(v){const q=getCurrent();if(!q||answers[q.id])return;let a=[...draft(q)];if(a.includes(v))a=a.filter(x=>x!==v);else a.push(v);ui.draft[q.id]=a;redraw(true)}
function setMatch(i,v){const q=getCurrent();if(!q||answers[q.id])return;const d=[...draft(q)];d[i]=v;ui.draft[q.id]=d;redraw(true)}
function moveOrder(i,dir){const q=getCurrent();if(!q||answers[q.id])return;const a=[...draft(q)],j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];ui.draft[q.id]=a;redraw(true)}
function toggleUnsure(){const q=getCurrent();if(!q)return;if(answers[q.id]){answers[q.id].uncertain=!answers[q.id].uncertain;store()}else ui.uncertain[q.id]=!ui.uncertain[q.id];redraw(true)}
function toggleHint(){const q=getCurrent();if(q){ui.hints[q.id]=!ui.hints[q.id];redraw(true)}}
function submit(){const q=getCurrent();if(!q)return;let v=draft(q);if(!hasValue(q,v))return;let right=equals(q,v);answers[q.id]={value:v,correct:right,uncertain:!!ui.uncertain[q.id]||(!right),tries:(answers[q.id]?.tries||0)+1};store();redraw(true)}
function retry(){const q=getCurrent();if(!q)return;delete answers[q.id];delete ui.draft[q.id];store();redraw(true)}
function next(){const seq=currentSeq();if(!seq.length)return;let current=getCurrent();if(ui.view==='review'){
 let list=problems();let ix=list.findIndex(q=>q.id===current?.id);ui.reviewIndex=ix<0?Math.min(ui.reviewIndex,Math.max(0,list.length-1)):Math.min(ix+1,Math.max(0,list.length-1));redraw(true);return;
 }if(ui.qidx<seq.length-1){ui.qidx++;redraw(true);return}if(ui.view==='maps'){
 const j=MAPS.findIndex(b=>b.id===ui.block);if(j<MAPS.length-1){ui.block=MAPS[j+1].id;ui.qidx=0;redraw(false)}else navigate('home');
 }else navigate('home')}
function previous(){if(ui.view==='review'){ui.reviewIndex=Math.max(0,ui.reviewIndex-1);redraw(true);return}ui.qidx=Math.max(0,ui.qidx-1);redraw(true)}
function setReset(){ui.wantReset=!ui.wantReset;redraw(true)}
function reallyReset(){answers={};ui.wantReset=false;ui.draft={};ui.uncertain={};store();navigate('home')}
function exportReport(){const rows=ALL.map(q=>({obszar:groupByQ[q.id]?'Mapy':CHRON.includes(q)?'Chronologia':'Źródła',zadanie:q.t,poprawnie:answers[q.id]?.correct??null,niepewne:answers[q.id]?.uncertain??false,proby:answers[q.id]?.tries??0}));const json=JSON.stringify({projekt:'HiSLogos — Misja: piątek',utworzono:new Date().toISOString(),wynik:{odpowiedziane:attempted(),poprawne:successes(),powtorka:problems().length},zadania:rows},null,2);let blob=new Blob([json],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HiSLogos_wyniki.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function topNav(){let tabs=[['home','Start'],['maps','Mapy'],['chrono','Czas'],['detective','Źródła'],['review','↻ Błędy']];document.getElementById('navigation').innerHTML=tabs.map(([id,label])=>`<button class="${ui.view===id?'active':''} ${id==='review'?'repeat-top':''}" onclick="navigate('${id}')">${label}${id==='review'&&problems().length?' · '+problems().length:''}</button>`).join('')}
function statbar(){return `<div class="stat-bar"><div class="stat"><strong>${attempted()}<span class="muted"> / ${TOTAL}</span></strong><small>PRZEĆWICZONE</small></div><div class="stat"><strong>${successes()}</strong><small>POPRAWNE TERAZ</small></div><div class="stat"><strong>${problems().length}</strong><small>DO POWTÓRKI</small></div><div class="stat-wide"><strong style="font-size:14px">Twój postęp</strong><div class="mini-progress"><span style="width:${pct(attempted(),TOTAL)}%"></span></div><p>Wyniki pozostają zapisane w tej przeglądarce.</p></div></div>`}
function home(){const bits=[{id:'maps',i:'I',name:'Mapy i granice',desc:'Sześć wypraw po historycznych mapach. Ziemie, państwa, bitwy i zmiany granic.',color:'#a24637',data:groupCount('maps'),icon:'↗'},{id:'chrono',i:'II',name:'Maszyna czasu',desc:'Oś czasu, daty, pułapki i wydarzenia, które lubią zamieniać się miejscami.',color:'#a9754b',data:groupCount('chrono'),icon:'⌛'},{id:'detective',i:'III',name:'Detektyw historyczny',desc:'Rozpoznawaj źródła, czytaj dokumenty i wyciągaj tylko uzasadnione wnioski.',color:'#526a57',data:groupCount('detective'),icon:'⌕'}];return `<section class="hero"><div class="overline">HiSLogos • trening przed etapem szkolnym</div><h1>Misja:<br><span>piątek.</span></h1><p>Nie musisz przerabiać całej historii od początku. Czas odzyskać punkty tam, gdzie uciekają: na mapach, w datach i przy analizie źródeł.</p><div class="hero-footer"><button class="button primary" onclick="navigate('maps')">Rozpocznij misję ↗</button><div class="date-pill">ETAP SZKOLNY · 23 PAŹDZIERNIKA 2026</div></div></section>${statbar()}<div class="section-top"><div><div class="overline" style="color:var(--red)">Trzy narzędzia, jeden cel</div><h2>Wybierz swój trening</h2></div><span class="chip">${TOTAL} zadań</span></div><div class="dash">${bits.map(b=>`<article class="module-card" style="--accent:${b.color}"><div class="num">${b.i}.</div><h3>${b.name}</h3><p>${b.desc}</p><div class="card-bottom"><div><b>${b.data.done} / ${b.data.all}</b><div class="mini-progress" style="width:120px"><span style="width:${pct(b.data.done,b.data.all)}%"></span></div></div><button class="button ink" onclick="navigate('${b.id}')">Wejdź ${b.icon}</button></div></article>`).join('')}</div><div class="intro-panel" style="margin-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center"><div><div class="overline" style="color:var(--red)">Własna lista poprawek</div><h3 style="margin:8px 0">Powtórz moje błędy</h3><p style="margin:0">Zadania z błędnymi odpowiedziami lub znakiem niepewności wracają tutaj automatycznie. Po poprawnej odpowiedzi znikają z kolejki.</p></div><button class="button primary" onclick="navigate('review')">Powtórz ${problems().length} zadań →</button></div>${footer()}`}
function footer(){return `<div class="footer">HiSLogos · Materiał edukacyjny do prywatnego treningu · Mapy: ZPE, OER Project; dokumenty: AGAD/Wikimedia Commons; malarstwo: domena publiczna.<br><span>Mapa może wymagać połączenia z internetem. Same zadania i zapis postępów działają lokalnie.</span><div class="media-row" style="justify-content:center"><a target="_blank" rel="noopener noreferrer" href="${ZPE.g1}">Źródła Piastowie</a><a target="_blank" rel="noopener noreferrer" href="${ZPE.g3}">Źródła XVII w.</a><a target="_blank" rel="noopener noreferrer" href="${ZPE.g6}">Źródła wojna północna</a></div></div>`}
function mapPicker(){return `<div class="section-top"><div><div class="overline" style="color:var(--red)">Atlas ćwiczeń</div><h2>I. Mapy i granice</h2></div><span class="chip">${groupCount('maps').done} / ${groupCount('maps').all}</span></div><div class="block-grid">${MAPS.map((b,i)=>{let done=b.qs.filter(solved).length;return `<button class="block-tab ${ui.block===b.id?'active':''}" onclick="chooseBlock('${b.id}')"><span class="eyebrow">WYPRAWA ${String(i+1).padStart(2,'0')} · ${b.era}</span><strong>${b.short}</strong><small>${done} / ${b.qs.length} zadań · ${pct(done,b.qs.length)}%</small><div class="mini-progress"><span style="width:${pct(done,b.qs.length)}%"></span></div></button>`}).join('')}</div>`}
function image(src,cls='',title=''){return `<img ${cls?`class="${cls}"`:''} src="${esc(src)}" alt="${esc(title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.map-frame')?.classList.add('unloaded')">`}
function mapPanel(b,active){const can=active?.type==='spot'&&!answers[active.id];const selected=can?draft(active):answers[active?.id]?.value;const points=b.points.map(p=>`<button title="Punkt ${p[0]}" aria-label="Zaznacz punkt ${p[0]} na mapie" class="pin ${selected===p[0]?'selected':''}" style="--x:${p[2]}%;--y:${p[3]}%" ${can?`onclick="setChoice('${p[0]}')"`: 'disabled'}>${p[0]}</button>`).join('');let extra=b.id==='g6'?`<div class="media-row"><a href="https://zpe.gov.pl/a/film--sprawdz-sie/Dj0xtmkDg" target="_blank" rel="noopener">▶ Film ZPE: wielka wojna północna</a></div>`:b.id==='g2'?`<div class="media-row"><a target="_blank" rel="noopener" href="${b.src}">▶ Multimedia ZPE: rozbicie dzielnicowe</a></div>`:'';return `<aside class="atlas-panel"><div class="atlas-title"><div><h3>${esc(b.name)}</h3><small>${esc(b.era)}</small></div><a href="${esc(b.img)}" target="_blank" rel="noopener noreferrer">Powiększ ↗</a></div><div class="map-frame">${image(b.img,'',b.name)}<div class="map-shadow"></div>${points}<div class="map-error"><strong>Mapa nie została załadowana.</strong><span>Do wyświetlania map potrzebny jest internet.</span><a href="${b.src}" target="_blank" rel="noopener">Otwórz mapę ZPE ↗</a></div></div><div class="pin-legend"><b>${can?'Wskaż odpowiednią literę na mapie.':'Litery A–'+b.points[b.points.length-1][0]+' oznaczają miejsca do ćwiczenia.'}</b> Kliknij „Powiększ”, jeśli opisy są zbyt drobne.</div><div class="tip-panel"><strong>Klucz do mapy</strong><p>${esc(b.lesson)}</p>${extra}</div><div class="atlas-bottom">${esc(b.imgNote)}<br><a href="${b.src}" target="_blank" rel="noopener noreferrer">Oryginalna lekcja i ćwiczenia ZPE ↗</a>${b.id==='g4'?` · <a target="_blank" rel="noopener" href="${ZPE.g4b}">Mapa wypraw na Moskwę ↗</a>`:''}</div></aside>`}
function chronoPanel(){return `<aside class="atlas-panel"><div class="atlas-title"><h3>Warsztat chronologa</h3><span class="chip">XXVII wieków historii? Nie dziś.</span></div><div style="padding:30px 25px"><div class="overline" style="color:var(--red)">Trzy kotwice czasu</div><div style="border-left:2px solid #b8936b;padding-left:22px;margin:25px 7px"><div style="padding:0 0 27px"><strong style="font:28px Georgia;color:var(--red)">1648</strong><p style="margin:3px 0;color:var(--sub)">Początek powstania Chmielnickiego. Punkt startowy długiego kryzysu.</p></div><div style="padding:0 0 27px"><strong style="font:28px Georgia;color:var(--red)">1683</strong><p style="margin:3px 0;color:var(--sub)">Wiedeń. Ważne zwycięstwo nad Osmanami, ale nie koniec wszystkich wojen.</p></div><div><strong style="font:28px Georgia;color:var(--red)">1709</strong><p style="margin:3px 0;color:var(--sub)">Połtawa. Od teraz przewagę zdobywa Rosja.</p></div></div><div class="lesson-note"><strong>Strategia:</strong> jeśli dwie daty są podobne, skojarz każdą z przeciwnikiem, miejscem i następstwem. Wtedy liczby przestają się mieszać.</div><div class="media-row"><a href="https://zpe.gov.pl/a/film--sprawdz-sie/Dj0xtmkDg" target="_blank" rel="noopener">▶ Film: wojna północna</a></div></div></aside>`}
function detectivePanel(){return `<aside class="atlas-panel"><div class="atlas-title"><h3>Archiwum źródeł</h3><span class="chip">Zobacz, potem oceniaj</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px">${image(IMG.akt,'','Akt konfederacji warszawskiej')}${image(IMG.obraz,'','Obraz historyczny Jana Matejki')}</div><div class="tip-panel"><strong>Cztery pytania detektywa</strong><p>KTO stworzył źródło? KIEDY? DLA KOGO? W JAKIM CELU?</p><p><b>Uwaga:</b> akt z 1573 roku i obraz o wydarzeniu z 966 roku nie są tym samym rodzajem świadectwa.</p></div><div class="atlas-bottom">Archiwum Główne Akt Dawnych · Jan Matejko, obraz z 1889 r. · <a href="https://agad.gov.pl/KGW/index.html" target="_blank" rel="noopener">Zobacz archiwum ↗</a></div></aside>`}
function rightAnswerText(q){if(q.type==='single')return q.a;if(q.type==='pics')return q.opts[q.a].label;if(q.type==='spot'){let b=MAPS.find(x=>x.qs.some(a=>a.id===q.id));let pt=b.points.find(p=>p[0]===q.a);return `punkt ${q.a}${pt?' — '+pt[1]:''}`}if(q.type==='match')return q.pairs.map(p=>p[0]+' → '+p[1]).join('; ');if(q.type==='order')return q.events.map(x=>x[1]).join(' → ');if(q.type==='multi')return q.a.join('; ');return ''}
function question(q,i,n){let record=answers[q.id];let isDone=!!record;let v=draft(q);let options='';if(q.type==='single'||q.type==='multi')options=`<div class="answers">${q.opts.map((op,j)=>{let chosen=q.type==='multi'?v.includes(op):v===op;return `<button class="answer ${chosen?'selected':''}" ${isDone?'disabled':''} onclick="${q.type==='multi'?`toggleMulti(${JSON.stringify(op).replace(/"/g,'&quot;')})`:`setChoice(${JSON.stringify(op).replace(/"/g,'&quot;')})`}"><span class="letter">${q.type==='multi'?(chosen?'✓':'+'):'ABCD'[j]}</span>${esc(op)}</button>`}).join('')}</div>`;
 if(q.type==='pics')options=`<div class="visual-answers">${q.opts.map((op,j)=>`<button class="answer visual ${v===j?'selected':''}" ${isDone?'disabled':''} onclick="setChoice(${j})"><img loading="lazy" src="${esc(op.img)}" alt="${esc(op.label)}"><span>${v===j?'✓ ':''}${esc(op.label)}</span></button>`).join('')}</div>`;
 if(q.type==='spot')options=`<div class="review-info">${isDone?`Zaznaczono punkt <strong>${esc(v)}</strong>.`:'Na mapie obok wybierz literę A, B, C…'} ${v&&!isDone?`<span class="badge-info">Wybrano: ${esc(v)}</span>`:''}</div>`;
 if(q.type==='match')options=`<div class="match">${q.pairs.map((p,j)=>`<div class="match-row"><label for="m${q.id}${j}">${esc(p[0])}</label><select id="m${q.id}${j}" ${isDone?'disabled':''} onchange="setMatch(${j},this.value)"><option value="">Wybierz odpowiedź…</option>${q.opts.map(o=>`<option value="${esc(o)}" ${v[j]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div>`;
 if(q.type==='order')options=`<div class="sort-items">${v.map((item,j)=>`<div class="sort-row"><strong class="sort-index">${j+1}.</strong><div class="sort-label">${esc(item)}</div><button ${isDone||j===0?'disabled':''} aria-label="Przesuń w górę" onclick="moveOrder(${j},-1)">↑</button><button ${isDone||j===v.length-1?'disabled':''} aria-label="Przesuń w dół" onclick="moveOrder(${j},1)">↓</button></div>`).join('')}</div><div class="q-sub" style="margin:12px 0 0">Strzałkami przesuń wydarzenia od najstarszego (u góry) do najmłodszego (na dole).</div>`;
 let fig=q.figure?`<figure class="source-image"><img src="${esc(q.figure.img)}" alt="${esc(q.figure.caption)}" loading="lazy"><figcaption>${esc(q.figure.caption)}</figcaption></figure>`:'';
 let quote=q.quote?`<div class="source-quote"><small>Tekst do analizy</small>${esc(q.quote)}</div>`:'';
 let hint=ui.hints[q.id]&&q.hint?`<div class="hint">Podpowiedź: ${esc(q.hint)}</div>`:'';
 let feedback=isDone?`<div class="feedback ${record.correct?'':'wrong'}" role="status"><h4>${record.correct?'✓ Trafione.': '↻ Tę rzecz warto poprawić.'}</h4><p>${esc(q.why)}</p>${!record.correct?`<p style="margin-top:9px"><b>Poprawna odpowiedź:</b> ${esc(rightAnswerText(q))}</p>`:''}${record.uncertain&&record.correct?'<small>To zadanie zostaje w powtórce, dopóki nie wyłączysz znaku niepewności.</small>':''}</div>`:'';
 return `<article class="question-panel" id="zadanie"><div class="quest-head"><div><div class="quest-label">${ui.view==='review'?'Powtórka błędów':ui.view==='maps'?'Czytanie mapy':ui.view==='chrono'?'Maszyna czasu':'Detektyw historyczny'}</div><div class="quest-progress"><span style="width:${pct(i+1,n)}%"></span></div></div><div class="quest-count">Zadanie ${i+1} z ${n}</div></div><h3>${esc(q.t)}</h3>${q.type==='multi'?'<p class="q-sub">Możesz wskazać kilka odpowiedzi.</p>':''}${quote}${fig}${options}${hint}${feedback}<div class="q-actions"><div>${q.hint&&!isDone?`<button class="soft" onclick="toggleHint()">${ui.hints[q.id]?'Ukryj podpowiedź':'Daj mi wskazówkę'}</button>`:''}<button class="soft ${record?.uncertain||ui.uncertain[q.id]?'active':''}" onclick="toggleUnsure()">${record?.uncertain||ui.uncertain[q.id]?'◆ Zaznaczone jako niepewne':'◇ Nie jestem pewien'}</button></div><div class="actions-right">${isDone&&!record.correct?`<button class="button paper" onclick="retry()">Jeszcze raz ↻</button>`:''}${!isDone?`<button class="button primary" ${!hasValue(q,v)?'disabled':''} onclick="submit()">Sprawdź →</button>`:`<button class="button primary" onclick="next()">${ui.view==='review'?'Dalej ↗':'Następne →'}</button>`}</div></div></article>`}
function containerView(){let q=getCurrent(),seq=currentSeq();if(ui.view==='review'&&(!q||seq.length===0))return `<div class="section-top"><div><div class="overline" style="color:var(--red)">Czwarty tryb</div><h2>Powtórz moje błędy</h2></div></div><div class="empty"><div style="font:58px Georgia;color:var(--green)">✓</div><h3>Na ten moment kolejka jest pusta.</h3><p>Rozwiązuj zadania w innych modułach. Każda pomyłka lub oznaczenie „nie jestem pewien” trafia tutaj automatycznie.</p><button class="button ink" onclick="navigate('home')">Wróć do treningu</button></div>${footer()}`;
 let block=ui.view==='maps'?MAPS.find(b=>b.id===ui.block):ui.view==='review'?MAPS.find(b=>b.id===groupByQ[q.id]):null;
 let title=ui.view==='maps'?mapPicker():`<div class="section-top"><div><div class="overline" style="color:var(--red)">${ui.view==='review'?'Sesja naprawcza':ui.view==='chrono'?'Kolejność ma znaczenie':'Czytaj jak historyk'}</div><h2>${ui.view==='review'?'Powtórz moje błędy':ui.view==='chrono'?'II. Maszyna czasu':'III. Detektyw historyczny'}</h2></div><span class="chip">${ui.view==='review'?seq.length+' do poprawy':groupCount(ui.view).done+' / '+groupCount(ui.view).all}</span></div>`;
 let left=block?mapPanel(block,q):ui.view==='chrono'?chronoPanel():ui.view==='detective'?detectivePanel():q&&CHRON.includes(q)?chronoPanel():detectivePanel();
 let intro=ui.view==='review'?`<div class="review-info"><b>Naprawiamy to, co wymaga powtórki.</b> Lista powstaje z poprzednich odpowiedzi. Poprawnie rozwiązane zadanie znika z kolejki, o ile nie oznaczysz go jako niepewne.</div>`:'';
